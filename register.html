<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 校园活动管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width:450px">
    <div class="text-center mb-4">
      <div class="mb-3">
        <i class="bi bi-person-plus text-primary" style="font-size:2.5rem"></i>
      </div>
      <h2>创建账号</h2>
      <p class="subtitle">加入我们，开始探索</p>
    </div>

    <div id="errorMsg" class="alert-error mb-3 d-none"></div>

    <form id="registerForm" novalidate>
      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <div class="form-floating">
            <input type="text" class="form-control" id="username" placeholder="用户名" required>
            <label for="username">用户名</label>
          </div>
        </div>
        <div class="col-sm-6">
          <div class="form-floating">
            <input type="text" class="form-control" id="nickname" placeholder="昵称" required>
            <label for="nickname">昵称</label>
          </div>
        </div>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="密码" required>
        <label for="password">密码</label>
      </div>
      <div class="form-floating mb-4">
        <input type="tel" class="form-control" id="phone" placeholder="手机号（可选）">
        <label for="phone">手机号（可选）</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
        <i class="bi bi-person-check me-2"></i>注册
      </button>
    </form>

    <div class="text-center">
      <small class="text-muted">已有账号？<a href="login.html" class="text-primary fw-medium">立即登录</a></small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (getCurrentUser()) {
      window.location.href = 'index.html';
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();
      const errorEl = document.getElementById('errorMsg');

      if (!username || !nickname || !password) {
        errorEl.textContent = '请填写用户名、昵称和密码';
        errorEl.classList.remove('d-none');
        return;
      }

      if (password.length < 4) {
        errorEl.textContent = '密码至少4位';
        errorEl.classList.remove('d-none');
        return;
      }

      const users = getUsers();
      if (users.some(u => u.username === username)) {
        errorEl.textContent = '用户名已存在';
        errorEl.classList.remove('d-none');
        return;
      }

      errorEl.classList.add('d-none');
      const newUser = registerUser({ username, nickname, password, phone });
      setCurrentUser(newUser);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
