<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 校园活动管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="main-nav"></div>

  <div id="pageContent">
    <!-- Dynamic content -->
  </div>

  <!-- Avatar Modal -->
  <div class="modal fade" id="avatarModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title"><i class="bi bi-image text-primary me-2"></i>更换头像</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-medium">上传头像</label>
            <input type="file" class="form-control" id="avatarUpload" accept="image/*">
          </div>
          <div class="mb-3">
            <label class="form-label fw-medium">或从画廊选择</label>
            <div class="d-flex flex-wrap gap-2" id="avatarGallery"></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" onclick="saveAvatar()">确认</button>
        </div>
      </div>
    </div>
  </div>

  <div id="main-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentUser = null;
    let selectedAvatar = '';

    document.addEventListener('DOMContentLoaded', function() {
      currentUser = requireAuth();
      if (!currentUser) return;

      // Refresh user data from storage
      const users = getUsers();
      const fresh = users.find(u => u.id === currentUser.id);
      if (fresh) {
        currentUser = fresh;
        setCurrentUser(fresh);
      }

      renderPage();
      renderAvatarGallery();
    });

    function renderPage() {
      const user = currentUser;
      const myRegs = getRegistrationsByUser(user.id);
      const activities = getActivities();

      let regCards = myRegs.map(reg => {
        const act = activities.find(a => a.id === reg.activityId);
        if (!act) return '';
        const isEnded = act.status === 'ended';
        return '<div class="registration-card glass-card p-3 mb-3 d-flex align-items-center gap-3">' +
          '<img src="' + act.image + '" class="rounded" width="60" height="60" style="object-fit:cover">' +
          '<div class="flex-grow-1">' +
            '<h6 class="mb-0"><a href="activity-detail.html?id=' + act.id + '" class="text-decoration-none text-dark">' + act.title + '</a></h6>' +
            '<small class="text-muted"><i class="bi bi-clock me-1"></i>' + act.startTime + '</small>' +
          '</div>' +
          '<div>' +
            (isEnded ? '<span class="badge bg-secondary">已结束</span>' :
              '<button class="btn btn-outline-danger btn-sm" onclick="cancelReg(' + act.id + ')"><i class="bi bi-x-circle me-1"></i>取消</button>') +
          '</div>' +
        '</div>';
      }).join('');

      if (myRegs.length === 0) {
        regCards = '<div class="empty-state py-4"><i class="bi bi-calendar-x"></i><p>还没有报名任何活动</p><a href="index.html" class="btn btn-primary btn-sm">去报名</a></div>';
      }

      document.getElementById('pageContent').innerHTML =
        '<section class="profile-header">' +
          '<div class="container">' +
            '<div class="d-flex align-items-center gap-3">' +
              '<img src="' + user.avatar + '" class="profile-avatar" alt="avatar" style="cursor:pointer" data-bs-toggle="modal" data-bs-target="#avatarModal">' +
              '<div>' +
                '<h3 class="mb-0">' + user.nickname + '</h3>' +
                '<p class="mb-0 opacity-75">@' + user.username + '</p>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</section>' +
        '<div class="container py-4">' +
          '<div class="row g-4">' +
            '<div class="col-lg-7">' +
              '<div class="glass-card p-4">' +
                '<h5 class="section-title"><i class="bi bi-calendar-check text-primary me-2"></i>我的报名</h5>' +
                regCards +
              '</div>' +
            '</div>' +
            '<div class="col-lg-5">' +
              '<div class="glass-card p-4">' +
                '<h5 class="section-title"><i class="bi bi-person-gear text-primary me-2"></i>个人资料</h5>' +
                '<form id="profileForm">' +
                  '<div class="text-center mb-3">' +
                    '<img src="' + user.avatar + '" class="rounded-circle" width="80" height="80" style="object-fit:cover;cursor:pointer" data-bs-toggle="modal" data-bs-target="#avatarModal">' +
                    '<div class="mt-1"><small class="text-primary" style="cursor:pointer" data-bs-toggle="modal" data-bs-target="#avatarModal">更换头像</small></div>' +
                  '</div>' +
                  '<div class="form-floating mb-3">' +
                    '<input type="text" class="form-control" id="editNickname" value="' + user.nickname + '">' +
                    '<label for="editNickname">昵称</label>' +
                  '</div>' +
                  '<div class="form-floating mb-3">' +
                    '<input type="tel" class="form-control" id="editPhone" value="' + (user.phone || '') + '">' +
                    '<label for="editPhone">手机号</label>' +
                  '</div>' +
                  '<button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg me-2"></i>保存修改</button>' +
                '</form>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const nickname = document.getElementById('editNickname').value.trim();
        const phone = document.getElementById('editPhone').value.trim();

        if (!nickname) {
          showToast('昵称不能为空', 'error');
          return;
        }

        const users = getUsers();
        const idx = users.findIndex(u => u.id === currentUser.id);
        if (idx !== -1) {
          users[idx].nickname = nickname;
          users[idx].phone = phone;
          setUsers(users);
          currentUser = users[idx];
          setCurrentUser(users[idx]);
          showToast('资料已更新');
          renderNavbar();
          renderPage();
        }
      });
    }

    function cancelReg(activityId) {
      if (confirm('确定要取消此报名吗？')) {
        if (cancelRegistration(currentUser.id, activityId)) {
          showToast('已取消报名');
          renderPage();
        }
      }
    }

    function renderAvatarGallery() {
      const gallery = document.getElementById('avatarGallery');
      if (!gallery) return;
      let html = '';
      for (let i = 1; i <= 8; i++) {
        const url = 'https://picsum.photos/seed/avatar' + i + '/200/200';
        html += '<img src="' + url + '" class="avatar-option" data-url="' + url + '" onclick="selectAvatar(this)">';
      }
      gallery.innerHTML = html;
    }

    function selectAvatar(el) {
      document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = el.dataset.url;
    }

    function saveAvatar() {
      const upload = document.getElementById('avatarUpload');
      let newUrl = selectedAvatar;

      // If file uploaded, use FileReader (simulated)
      if (upload.files && upload.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          newUrl = e.target.result;
          updateAvatar(newUrl);
        };
        reader.readAsDataURL(upload.files[0]);
        return;
      }

      if (!newUrl) {
        showToast('请选择或上传头像', 'warning');
        return;
      }

      updateAvatar(newUrl);
    }

    function updateAvatar(url) {
      const users = getUsers();
      const idx = users.findIndex(u => u.id === currentUser.id);
      if (idx !== -1) {
        users[idx].avatar = url;
        setUsers(users);
        currentUser = users[idx];
        setCurrentUser(users[idx]);
        showToast('头像已更换');
        bootstrap.Modal.getInstance(document.getElementById('avatarModal')).hide();
        renderNavbar();
        renderPage();
        renderAvatarGallery();
      }
    }
  </script>
</body>
</html>
