<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动详情 - 校园活动管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="main-nav"></div>

  <div class="container py-5" style="margin-top:80px">
    <div id="activityContent">
      <!-- Dynamic content -->
    </div>
  </div>

  <div id="main-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const id = getQueryParam('id');
      if (!id) {
        window.location.href = 'index.html';
        return;
      }
      renderDetail(id);
    });

    function renderDetail(activityId) {
      const activity = getActivityById(activityId);
      if (!activity) {
        document.getElementById('activityContent').innerHTML =
          '<div class="empty-state"><i class="bi bi-exclamation-circle"></i><p>活动不存在</p><a href="index.html" class="btn btn-primary">返回首页</a></div>';
        return;
      }

      const user = getCurrentUser();
      const count = getParticipantCount(activity.id);
      const isFull = count >= activity.maxParticipants;
      const isEnded = activity.status === 'ended';
      const isReg = user && isRegistered(user.id, activity.id);
      const progress = Math.min((count / activity.maxParticipants) * 100, 100);
      const isAdmin = user && user.role === 1;

      let actionBtn = '';
      if (isEnded) {
        actionBtn = '<button class="btn btn-secondary w-100 py-2" disabled>活动已结束</button>';
      } else if (isReg) {
        actionBtn = '<button class="btn btn-outline-danger w-100 py-2" onclick="handleCancel(' + activity.id + ')"><i class="bi bi-x-circle me-2"></i>取消报名</button>';
      } else if (isFull) {
        actionBtn = '<button class="btn btn-secondary w-100 py-2" disabled>名额已满</button>';
      } else if (!user) {
        actionBtn = '<a href="login.html" class="btn btn-primary w-100 py-2"><i class="bi bi-person-plus me-2"></i>登录后报名</a>';
      } else {
        actionBtn = '<button class="btn btn-primary w-100 py-2" onclick="handleRegister(' + activity.id + ')"><i class="bi bi-person-plus me-2"></i>立即报名</button>';
      }

      let adminBtns = '';
      if (isAdmin) {
        adminBtns = '<div class="d-flex gap-2 mt-2">' +
          '<a href="activity-form.html?id=' + activity.id + '" class="btn btn-outline-secondary w-100"><i class="bi bi-pencil me-1"></i>编辑活动</a>' +
          '<button class="btn btn-outline-danger w-100" onclick="handleDelete(' + activity.id + ')"><i class="bi bi-trash me-1"></i>删除活动</button>' +
          '</div>';
      }

      const statusBadge = isEnded ? '<span class="badge bg-secondary">已结束</span>' :
        isFull ? '<span class="badge bg-danger">名额已满</span>' :
        '<span class="badge bg-success">可报名</span>';

      document.getElementById('activityContent').innerHTML =
        '<nav aria-label="breadcrumb" class="mb-4">' +
          '<ol class="breadcrumb">' +
            '<li class="breadcrumb-item"><a href="index.html">活动广场</a></li>' +
            '<li class="breadcrumb-item active">' + activity.title + '</li>' +
          '</ol>' +
        '</nav>' +
        '<div class="row g-4">' +
          '<div class="col-lg-8">' +
            '<img src="' + activity.image + '" class="detail-image mb-4" alt="' + activity.title + '">' +
            '<div class="d-flex align-items-center gap-2 mb-3">' +
              '<h2 class="mb-0">' + activity.title + '</h2>' +
              statusBadge +
            '</div>' +
            '<div class="row g-3 mb-4">' +
              '<div class="col-sm-6"><div class="glass-card p-3"><i class="bi bi-clock text-primary me-2"></i><strong>开始时间</strong><br>' + activity.startTime + '</div></div>' +
              '<div class="col-sm-6"><div class="glass-card p-3"><i class="bi bi-clock-history text-primary me-2"></i><strong>结束时间</strong><br>' + activity.endTime + '</div></div>' +
              '<div class="col-sm-6"><div class="glass-card p-3"><i class="bi bi-geo-alt text-primary me-2"></i><strong>活动地点</strong><br>' + activity.location + '</div></div>' +
              '<div class="col-sm-6"><div class="glass-card p-3"><i class="bi bi-telephone text-primary me-2"></i><strong>联系方式</strong><br>' + activity.contact + '</div></div>' +
            '</div>' +
            '<div class="glass-card p-4 mb-4">' +
              '<h5 class="mb-3"><i class="bi bi-file-text text-primary me-2"></i>活动介绍</h5>' +
              '<p class="mb-0" style="line-height:1.8">' + activity.description + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="col-lg-4">' +
            '<div class="detail-sidebar">' +
              '<div class="glass-card p-4">' +
                '<h5 class="mb-3"><i class="bi bi-people text-primary me-2"></i>报名信息</h5>' +
                '<div class="d-flex justify-content-between mb-2">' +
                  '<span>已报名</span>' +
                  '<span class="fw-bold">' + count + ' / ' + activity.maxParticipants + '</span>' +
                '</div>' +
                '<div class="progress mb-3" style="height:10px">' +
                  '<div class="progress-bar" style="width:' + progress + '%"></div>' +
                '</div>' +
                '<div class="text-muted small mb-3">剩余名额：' + (activity.maxParticipants - count) + '</div>' +
                actionBtn +
                adminBtns +
              '</div>' +
              '<div class="glass-card p-4 mt-3">' +
                '<h6 class="mb-2"><i class="bi bi-info-circle text-primary me-1"></i>活动信息</h6>' +
                '<small class="text-muted">发布于 ' + activity.createdAt + '</small>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function handleRegister(activityId) {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      if (registerForActivity(user.id, activityId)) {
        showToast('报名成功！');
        renderDetail(activityId);
      } else {
        showToast('报名失败，请检查是否已报名或名额已满', 'error');
      }
    }

    function handleCancel(activityId) {
      const user = getCurrentUser();
      if (!user) return;
      if (confirm('确定要取消报名吗？')) {
        if (cancelRegistration(user.id, activityId)) {
          showToast('已取消报名');
          renderDetail(activityId);
        }
      }
    }

    function handleDelete(activityId) {
      if (confirm('确定要删除此活动吗？')) {
        deleteActivity(activityId);
        showToast('活动已删除');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
