<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动管理 - 校园活动管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="main-nav"></div>

  <div class="container py-5" style="margin-top:80px">
    <div id="pageContent">
      <!-- Dynamic content -->
    </div>
  </div>

  <div id="main-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentActivity = null;
    let activityId = null;

    document.addEventListener('DOMContentLoaded', function() {
      const user = requireAdmin();
      if (!user) return;

      activityId = getQueryParam('id');
      const isEdit = !!activityId;

      if (isEdit) {
        currentActivity = getActivityById(activityId);
        if (!currentActivity) {
          window.location.href = 'index.html';
          return;
        }
      }

      renderPage(user, isEdit);
    });

    function renderPage(user, isEdit) {
      const title = isEdit ? '编辑活动' : '发布活动';
      const a = currentActivity || {};

      document.getElementById('pageContent').innerHTML =
        '<nav aria-label="breadcrumb" class="mb-4">' +
          '<ol class="breadcrumb">' +
            '<li class="breadcrumb-item"><a href="index.html">活动广场</a></li>' +
            '<li class="breadcrumb-item active">' + title + '</li>' +
          '</ol>' +
        '</nav>' +
        '<h2 class="section-title"><i class="bi bi-' + (isEdit ? 'pencil' : 'plus-circle') + ' text-primary me-2"></i>' + title + '</h2>' +
        '<ul class="nav nav-tabs mb-4" id="formTabs">' +
          '<li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#infoTab">活动信息</a></li>' +
          (isEdit ? '<li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#membersTab">已报名人员</a></li>' : '') +
        '</ul>' +
        '<div class="tab-content">' +
          '<div class="tab-pane fade show active" id="infoTab">' +
            '<div class="glass-card p-4">' +
              '<form id="activityForm">' +
                '<div class="row g-3">' +
                  '<div class="col-12">' +
                    '<label class="form-label fw-medium">活动标题 <span class="text-danger">*</span></label>' +
                    '<input type="text" class="form-control" id="formTitle" value="' + (a.title || '') + '" required>' +
                  '</div>' +
                  '<div class="col-12">' +
                    '<label class="form-label fw-medium">活动描述 <span class="text-danger">*</span></label>' +
                    '<textarea class="form-control" id="formDesc" rows="5" required>' + (a.description || '') + '</textarea>' +
                  '</div>' +
                  '<div class="col-md-6">' +
                    '<label class="form-label fw-medium">开始时间 <span class="text-danger">*</span></label>' +
                    '<input type="datetime-local" class="form-control" id="formStart" value="' + (a.startTime ? a.startTime.replace(' ', 'T') : '') + '" required>' +
                  '</div>' +
                  '<div class="col-md-6">' +
                    '<label class="form-label fw-medium">结束时间 <span class="text-danger">*</span></label>' +
                    '<input type="datetime-local" class="form-control" id="formEnd" value="' + (a.endTime ? a.endTime.replace(' ', 'T') : '') + '" required>' +
                  '</div>' +
                  '<div class="col-12">' +
                    '<label class="form-label fw-medium">活动图片</label>' +
                    '<input type="file" class="form-control" id="formImage" accept="image/*">' +
                    '<div class="form-text">支持 JPG、PNG 格式（仅模拟上传）</div>' +
                    (a.image ? '<img src="' + a.image + '" class="mt-2 rounded" style="max-height:150px" id="previewImg">' : '') +
                  '</div>' +
                  '<div class="col-md-6">' +
                    '<label class="form-label fw-medium">活动地点 <span class="text-danger">*</span></label>' +
                    '<input type="text" class="form-control" id="formLocation" value="' + (a.location || '') + '" required>' +
                  '</div>' +
                  '<div class="col-md-6">' +
                    '<label class="form-label fw-medium">最大人数 <span class="text-danger">*</span></label>' +
                    '<input type="number" class="form-control" id="formMax" value="' + (a.maxParticipants || 50) + '" min="1" required>' +
                  '</div>' +
                  '<div class="col-12">' +
                    '<label class="form-label fw-medium">联系方式</label>' +
                    '<input type="text" class="form-control" id="formContact" value="' + (a.contact || '') + '">' +
                  '</div>' +
                  '<div class="col-12 mt-4">' +
                    '<button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-2"></i>' + (isEdit ? '保存修改' : '发布活动') + '</button>' +
                    '<a href="index.html" class="btn btn-outline-secondary ms-2">取消</a>' +
                  '</div>' +
                '</div>' +
              '</form>' +
            '</div>' +
          '</div>' +
          (isEdit ? renderMembersTab() : '') +
        '</div>';

      document.getElementById('activityForm').addEventListener('submit', function(e) {
        e.preventDefault();
        saveForm(isEdit);
      });

      if (isEdit) {
        document.getElementById('memberSearch')?.addEventListener('input', function() {
          renderMembersList();
        });
      }
    }

    function renderMembersTab() {
      return '<div class="tab-pane fade" id="membersTab">' +
        '<div class="glass-card p-4">' +
          '<div class="d-flex justify-content-between align-items-center mb-3">' +
            '<h5 class="mb-0"><i class="bi bi-people text-primary me-2"></i>已报名人员</h5>' +
            '<button class="btn btn-outline-danger btn-sm" onclick="batchRemove()"><i class="bi bi-trash me-1"></i>批量移除</button>' +
          '</div>' +
          '<input type="text" class="form-control mb-3" id="memberSearch" placeholder="搜索用户名或昵称...">' +
          '<div class="table-responsive" id="membersTable"></div>' +
        '</div>' +
      '</div>';
    }

    function renderMembersList() {
      if (!activityId) return;
      const search = (document.getElementById('memberSearch')?.value || '').trim().toLowerCase();
      const regs = getRegistrationsByActivity(activityId);
      const users = getUsers();
      const container = document.getElementById('membersTable');

      let filtered = regs.map(r => {
        const u = users.find(usr => usr.id === r.userId);
        return { ...r, user: u };
      }).filter(item => item.user);

      if (search) {
        filtered = filtered.filter(item =>
          item.user.username.toLowerCase().includes(search) ||
          item.user.nickname.toLowerCase().includes(search)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state py-3"><i class="bi bi-people"></i><p>暂无报名人员</p></div>';
        return;
      }

      container.innerHTML =
        '<table class="table member-table table-hover">' +
          '<thead><tr><th><input type="checkbox" id="selectAll"></th><th>用户</th><th>昵称</th><th>报名时间</th><th>操作</th></tr></thead>' +
          '<tbody>' +
            filtered.map(item =>
              '<tr>' +
                '<td><input type="checkbox" class="member-check" data-reg-id="' + item.id + '"></td>' +
                '<td><img src="' + item.user.avatar + '" class="rounded-circle me-2" width="28" height="28" style="object-fit:cover">' + item.user.username + '</td>' +
                '<td>' + item.user.nickname + '</td>' +
                '<td class="text-muted small">' + item.registeredAt + '</td>' +
                '<td><button class="btn btn-outline-danger btn-sm" onclick="removeMember(' + item.id + ')"><i class="bi bi-x-lg"></i></button></td>' +
              '</tr>'
            ).join('') +
          '</tbody>' +
        '</table>';

      // Select all toggle
      document.getElementById('selectAll')?.addEventListener('change', function() {
        document.querySelectorAll('.member-check').forEach(cb => cb.checked = this.checked);
      });
    }

    // Listen for tab switch to render members
    document.addEventListener('shown.bs.tab', function(e) {
      if (e.target.getAttribute('href') === '#membersTab') {
        renderMembersList();
      }
    });

    function removeMember(regId) {
      if (confirm('确定移除此报名？')) {
        removeRegistration(regId);
        showToast('已移除报名');
        renderMembersList();
      }
    }

    function batchRemove() {
      const checked = document.querySelectorAll('.member-check:checked');
      if (checked.length === 0) {
        showToast('请先选择要移除的人员', 'warning');
        return;
      }
      if (confirm('确定移除选中的 ' + checked.length + ' 人？')) {
        checked.forEach(cb => removeRegistration(parseInt(cb.dataset.regId)));
        showToast('已批量移除 ' + checked.length + ' 人');
        renderMembersList();
      }
    }

    function saveForm(isEdit) {
      const title = document.getElementById('formTitle').value.trim();
      const description = document.getElementById('formDesc').value.trim();
      const startTime = document.getElementById('formStart').value.replace('T', ' ');
      const endTime = document.getElementById('formEnd').value.replace('T', ' ');
      const location = document.getElementById('formLocation').value.trim();
      const maxParticipants = parseInt(document.getElementById('formMax').value);
      const contact = document.getElementById('formContact').value.trim();

      if (!title || !description || !startTime || !endTime || !location) {
        showToast('请填写所有必填项', 'error');
        return;
      }

      const data = {
        title, description, startTime, endTime, location, maxParticipants, contact,
        image: isEdit && currentActivity ? currentActivity.image : 'https://picsum.photos/seed/new' + Date.now() + '/600/400'
      };

      if (isEdit) {
        data.id = activityId;
      }

      const result = saveActivity(data);
      showToast(isEdit ? '活动已更新' : '活动已发布');
      window.location.href = 'activity-detail.html?id=' + result.id;
    }
  </script>
</body>
</html>
