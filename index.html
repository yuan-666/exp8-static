<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动广场 - 校园活动管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="main-nav"></div>

  <!-- Hero Banner -->
  <section class="hero-banner text-center">
    <div class="container position-relative" style="z-index:2">
      <h1>发现你的下一个精彩时刻</h1>
      <p class="mb-4">探索校园活动，遇见志同道合的伙伴</p>
      <div class="search-bar">
        <div class="input-group">
          <input type="text" class="form-control" id="searchInput" placeholder="搜索活动名称或地点...">
          <button class="btn" id="searchBtn"><i class="bi bi-search"></i></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Activities -->
  <section class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="section-title mb-0"><i class="bi bi-fire text-primary me-2"></i>全部活动</h2>
        <div class="sort-dropdown dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-sort-down me-1"></i><span id="sortLabel">默认排序</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item active" href="#" data-sort="default">默认排序</a></li>
            <li><a class="dropdown-item" href="#" data-sort="newest">最新发布</a></li>
            <li><a class="dropdown-item" href="#" data-sort="earliest">最早开始</a></li>
            <li><a class="dropdown-item" href="#" data-sort="available">可报名优先</a></li>
          </ul>
        </div>
      </div>
      <div class="row g-4" id="activityGrid">
        <!-- Dynamic content -->
      </div>
      <div class="empty-state d-none" id="emptyState">
        <i class="bi bi-inbox"></i>
        <p class="fs-5">没有找到匹配的活动</p>
      </div>
    </div>
  </section>

  <div id="main-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentSort = 'default';
    let searchKeyword = '';

    document.addEventListener('DOMContentLoaded', function() {
      renderActivities();

      document.getElementById('searchInput').addEventListener('input', function() {
        searchKeyword = this.value.trim().toLowerCase();
        renderActivities();
      });

      document.getElementById('searchBtn').addEventListener('click', function() {
        searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
        renderActivities();
      });

      document.querySelectorAll('[data-sort]').forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.preventDefault();
          currentSort = this.dataset.sort;
          document.getElementById('sortLabel').textContent = this.textContent;
          document.querySelectorAll('[data-sort]').forEach(a => a.classList.remove('active'));
          this.classList.add('active');
          renderActivities();
        });
      });
    });

    function renderActivities() {
      const user = getCurrentUser();
      let activities = getActivities();

      // Search
      if (searchKeyword) {
        activities = activities.filter(a =>
          a.title.toLowerCase().includes(searchKeyword) ||
          a.location.toLowerCase().includes(searchKeyword)
        );
      }

      // Sort
      switch (currentSort) {
        case 'newest':
          activities.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
          break;
        case 'earliest':
          activities.sort((a, b) => a.startTime.localeCompare(b.startTime));
          break;
        case 'available':
          activities.sort((a, b) => {
            const aFull = getParticipantCount(a.id) >= a.maxParticipants;
            const bFull = getParticipantCount(b.id) >= b.maxParticipants;
            const aEnded = a.status === 'ended';
            const bEnded = b.status === 'ended';
            if (aEnded && !bEnded) return 1;
            if (!aEnded && bEnded) return -1;
            if (aFull && !bFull) return 1;
            if (!aFull && bFull) return -1;
            return 0;
          });
          break;
      }

      const grid = document.getElementById('activityGrid');
      const empty = document.getElementById('emptyState');

      if (activities.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('d-none');
        return;
      }

      empty.classList.add('d-none');

      grid.innerHTML = activities.map(function(activity) {
        const count = getParticipantCount(activity.id);
        const isFull = count >= activity.maxParticipants;
        const isEnded = activity.status === 'ended';
        const isReg = user && isRegistered(user.id, activity.id);
        const progress = Math.min((count / activity.maxParticipants) * 100, 100);
        const isAdmin = user && user.role === 1;

        let actionBtn = '';
        if (isEnded) {
          actionBtn = '<button class="btn btn-secondary btn-sm w-100" disabled>已结束</button>';
        } else if (isReg) {
          actionBtn = '<button class="btn btn-outline-danger btn-sm w-100" onclick="handleCancel(' + activity.id + ')"><i class="bi bi-x-circle me-1"></i>取消报名</button>';
        } else if (isFull) {
          actionBtn = '<button class="btn btn-secondary btn-sm w-100" disabled>名额已满</button>';
        } else if (!user) {
          actionBtn = '<a href="login.html" class="btn btn-primary btn-sm w-100"><i class="bi bi-person-plus me-1"></i>登录后报名</a>';
        } else {
          actionBtn = '<button class="btn btn-primary btn-sm w-100" onclick="handleRegister(' + activity.id + ')"><i class="bi bi-person-plus me-1"></i>立即报名</button>';
        }

        let adminBtns = '';
        if (isAdmin) {
          adminBtns = '<div class="d-flex gap-1 mt-2">' +
            '<a href="activity-form.html?id=' + activity.id + '" class="btn btn-outline-secondary btn-sm flex-fill"><i class="bi bi-pencil me-1"></i>编辑</a>' +
            '<button class="btn btn-outline-danger btn-sm flex-fill" onclick="handleDelete(' + activity.id + ')"><i class="bi bi-trash me-1"></i>删除</button>' +
            '</div>';
        }

        let statusBadge = '';
        if (isEnded) {
          statusBadge = '<span class="badge bg-secondary badge-overlay">已结束</span>';
        } else if (isFull) {
          statusBadge = '<span class="badge bg-danger badge-overlay">名额已满</span>';
        } else if (isReg) {
          statusBadge = '<span class="badge bg-info badge-overlay">已报名</span>';
        }

        return '<div class="col-md-6 col-lg-4">' +
          '<div class="activity-card">' +
            '<div class="card-img-wrapper">' +
              '<img src="' + activity.image + '" class="card-img-top" alt="' + activity.title + '">' +
              statusBadge +
            '</div>' +
            '<div class="card-body">' +
              '<h5 class="card-title">' + activity.title + '</h5>' +
              '<div class="card-meta mb-2"><i class="bi bi-geo-alt me-1"></i>' + activity.location + '</div>' +
              '<div class="card-meta mb-3"><i class="bi bi-clock me-1"></i>' + activity.startTime + '</div>' +
              '<div class="d-flex justify-content-between align-items-center mb-2">' +
                '<small class="text-muted">' + count + '/' + activity.maxParticipants + ' 人</small>' +
                '<small class="text-muted">' + Math.round(progress) + '%</small>' +
              '</div>' +
              '<div class="progress mb-3"><div class="progress-bar" style="width:' + progress + '%"></div></div>' +
              '<a href="activity-detail.html?id=' + activity.id + '" class="btn btn-outline-primary btn-sm w-100 mb-1"><i class="bi bi-eye me-1"></i>查看详情</a>' +
              actionBtn +
              adminBtns +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function handleRegister(activityId) {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      if (registerForActivity(user.id, activityId)) {
        showToast('报名成功！');
        renderActivities();
      } else {
        showToast('报名失败，请检查是否已报名或名额已满', 'error');
      }
    }

    function handleCancel(activityId) {
      const user = getCurrentUser();
      if (!user) return;
      if (confirm('确定要取消报名吗？')) {
        if (cancelRegistration(user.id, activityId)) {
          showToast('已取消报名');
          renderActivities();
        }
      }
    }

    function handleDelete(activityId) {
      if (confirm('确定要删除此活动吗？此操作不可撤销！')) {
        deleteActivity(activityId);
        showToast('活动已删除');
        renderActivities();
      }
    }
  </script>
</body>
</html>
