<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 校园活动管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width:400px">
    <div class="text-center mb-4">
      <div class="mb-3">
        <i class="bi bi-activity text-primary" style="font-size:2.5rem"></i>
      </div>
      <h2>欢迎回来</h2>
      <p class="subtitle">请登录您的账号</p>
    </div>

    <div id="errorMsg" class="alert-error mb-3 d-none"></div>

    <form id="loginForm" novalidate>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="username" placeholder="用户名" required>
        <label for="username">用户名</label>
      </div>
      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="password" placeholder="密码" required>
        <label for="password">密码</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>登录
      </button>
    </form>

    <div class="text-center">
      <small class="text-muted">还没有账号？<a href="register.html" class="text-primary fw-medium">立即注册</a></small>
    </div>

    <div class="mt-4 p-3 rounded-3" style="background:var(--primary-50);font-size:0.8rem">
      <p class="mb-1 fw-medium text-primary"><i class="bi bi-info-circle me-1"></i>测试账号</p>
      <p class="mb-0 text-muted">管理员：admin / admin123</p>
      <p class="mb-0 text-muted">学生：zhangsan / 123456</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Reset data to defaults on every visit to login page (ensures fresh demo state)
    resetData();
    initData();

    // If already logged in, redirect
    if (getCurrentUser()) {
      window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');

      if (!username || !password) {
        errorEl.textContent = '请输入用户名和密码';
        errorEl.classList.remove('d-none');
        return;
      }

      const users = getUsers();
      const user = users.find(u => u.username === username && u.password === password);

      if (!user) {
        errorEl.textContent = '用户名或密码错误';
        errorEl.classList.remove('d-none');
        return;
      }

      errorEl.classList.add('d-none');
      setCurrentUser(user);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
